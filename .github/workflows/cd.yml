name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    permissions:
      pages: write
      id-token: write
    env:
      # secrets.NEXT_PUBLIC_API_URL が未設定の場合でも本番デプロイが
      # localhostへ静かにフォールバックしないよう、既存のAPI Gateway URLを
      # フォールバックとして残す。secrets側の値が優先される。
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://alcm6iok74.execute-api.ap-northeast-1.amazonaws.com/dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # frontend/配下にdev-standards/shared/配下を指すsymlink
          # （sync-manifest.local.json参照）があり、submoduleの中身が
          # チェックアウトされていないとビルド時にリンク先を解決できず
          # 失敗するため必須（#307）。
          submodules: true
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.123.2
        with:
          working-directory: frontend
          artifact-path: frontend/out
          node-version: '24'
          workspaces: 'true'

  deploy-backend:
    runs-on: ubuntu-latest
    env:
      # serverless.ymlのprovider.environment.GEMINI_APIが${env:GEMINI_API, ''}で
      # デプロイ時に読み取るため、deploy-serverless複合action内のデプロイ
      # コマンド実行にも見えるようjob-levelで設定する（複合actionの
      # 内部stepはこのjobの一部として実行されるため、job-level envを継承する。
      # deploy-frontend jobのNEXT_PUBLIC_API_URLと同じ方式）。
      GEMINI_API: ${{ secrets.GEMINI_API }}
      # dev-standards/docs/ops-monitoring-pattern.md。運用監視専用LINE Bot
      # （全プロダクト共通）のチャンネルアクセストークン・通知先ユーザーID。
      # 未設定の場合、serverless.yml側で空文字列にフォールバックしデプロイ自体は
      # 妨げない（CloudWatch Alarmの発火・検知には影響しない。LINE通知の送信時に
      # のみエラーになる）
      OPS_ALERT_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.OPS_ALERT_LINE_CHANNEL_ACCESS_TOKEN }}
      OPS_ALERT_LINE_USER_ID: ${{ secrets.OPS_ALERT_LINE_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 🚀 Deploy Backend (Serverless Framework)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.123.2
        with:
          working-directory: backend
          node-version: '24'
          deploy-command: npx serverless deploy --verbose
          workspaces: 'true'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: serverless info
        working-directory: backend
        run: npx serverless info --verbose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
