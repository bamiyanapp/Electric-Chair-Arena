name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    permissions:
      pages: write
      id-token: write
    env:
      # secrets.NEXT_PUBLIC_API_URL が未設定の場合でも本番デプロイが
      # localhostへ静かにフォールバックしないよう、既存のAPI Gateway URLを
      # フォールバックとして残す。secrets側の値が優先される。
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://alcm6iok74.execute-api.ap-northeast-1.amazonaws.com/dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v1.22.0
        with:
          working-directory: frontend
          artifact-path: frontend/out
          node-version: '24'
          workspaces: 'true'

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: 🚀 Deploy Backend (Serverless Framework)
        working-directory: backend
        run: |
          npx serverless deploy --verbose
          npx serverless info --verbose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GEMINI_API: ${{ secrets.GEMINI_API }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
