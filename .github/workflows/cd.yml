name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    permissions:
      pages: write
      id-token: write
    env:
      # secrets.NEXT_PUBLIC_API_URL が未設定の場合でも本番デプロイが
      # localhostへ静かにフォールバックしないよう、既存のAPI Gateway URLを
      # フォールバックとして残す。secrets側の値が優先される。
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://alcm6iok74.execute-api.ap-northeast-1.amazonaws.com/dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.7.5
        with:
          working-directory: frontend
          artifact-path: frontend/out
          node-version: '24'
          workspaces: 'true'

  deploy-backend:
    runs-on: ubuntu-latest
    env:
      # serverless.ymlのprovider.environment.GEMINI_APIが${env:GEMINI_API, ''}で
      # デプロイ時に読み取るため、deploy-serverless複合action内のデプロイ
      # コマンド実行にも見えるようjob-levelで設定する（複合actionの
      # 内部stepはこのjobの一部として実行されるため、job-level envを継承する。
      # deploy-frontend jobのNEXT_PUBLIC_API_URLと同じ方式）。
      GEMINI_API: ${{ secrets.GEMINI_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 🚀 Deploy Backend (Serverless Framework)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.7.5
        with:
          working-directory: backend
          node-version: '24'
          deploy-command: npx serverless deploy --verbose
          workspaces: 'true'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: serverless info
        working-directory: backend
        run: npx serverless info --verbose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
