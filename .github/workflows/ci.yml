name: CI
run-name: CI ${{ github.event.pull_request.title }}

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v1.24.0
    with:
      frontend_dir: frontend
      backend_dir: backend
      node_version: '24'
      enable_release: false
      workspaces: true
      enable_standards_check: true
      enable_duplication_check: true
      duplication_threshold: 2
      coverage_threshold: 90
      coverage_metrics: 'statements,functions,lines'
      enable_mermaid_render: true
      mermaid_doc_paths: "docs/architecture.md\nREADME.md"
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
